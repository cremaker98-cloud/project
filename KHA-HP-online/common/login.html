<!DOCTYPE html>
<html lang="ko">
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="../assets/css/ol-reset.css" />
        <link rel="stylesheet" href="../assets/css/ol-style.css" />
        <title>한국주택협회 인터넷증명발급</title>
    </head>

    <body>
        <div class="wrapper">
            <!-- Top & Header -->
            <section class="top">
                <div data-include-path="../assets/inc/header.html"></div>
            </section>
            <!-- //Top & Header -->

            <main>
                <!-- Content -->
                <section class="container">
                    <div class="page-title">
                        <h3>로그인</h3>
                        <div>
                            <a href="#" class="btn-title"><img src="../assets/img/icon-title-link-3.png" /></a>
                        </div>
                    </div>

                    <div class="content">
                        <div class="loginWrap">
                            <div class="login-inner">
                                <p class="infotext">공인인증서 등록을 위해 로그인이 필요합니다.</p>

                                <ul>
                                    <li>
                                        <input type="text" placeholder="아이디를 입력해주세요." />

                                    </li>
                                    <li>
                                        <input type="password" placeholder="비밀번호를 입력해주세요." />
                                        <p class="check">오류 메시지 표시</p>
                                    </li>
                                    <li><button class="btn-login">로그인</button></li>
                                </ul>

                                <p>로그인, 아이디/비밀번호 관련은 협회 기획홍보실 (☎02-6900-9072)로 문의하시기 바랍니다.</p>
                            </div>
                        </div>
                    </div>
                </section>
                <!-- //Content -->
            </main>

            <section class="footer">
                <div data-include-path="../assets/inc/footer.html"></div>
            </section>
        </div>

    <script src="../assets/js/ol-include.js"></script>
