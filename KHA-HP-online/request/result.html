<!DOCTYPE html>
<html lang="ko">
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="../assets/css/ol-reset.css" />
        <link rel="stylesheet" href="../assets/css/ol-style.css" />
        <title>한국주택협회 인터넷증명발급</title>
    </head>

    <body>
        <!-- Top & Header -->
        <section class="top">
            <div data-include-path="../assets/inc/header.html"></div>
        </section>
        <!-- //Top & Header -->

        <main>
            <!-- LNB -->
            <section class="lnb">
                <div data-include-path="../assets/inc/lnb-request.html"></div>
                <div data-include-path="../assets/inc/lnb-link.html"></div>
            </section>
            <!-- //LNB -->

            <!-- Container -->
            <section class="container">
                <div class="page-title">
                    <h3>주택건설 실적 확인서</h3>
                    <div>
                        <a href="#" class="btn-title"><img src="../assets/img/icon-title-link-3.png" /></a>
                    </div>
                </div>

                <!-- Content -->
                <div class="content">
                    <div>
                        <table class="d-tb-view">
                            <tr>
                                <th>업체명</th>
                                <td><input type="text" size="30" disabled /></td>
                            </tr>
                            <tr>
                                <th>주택건설사업자 등록번호</th>
                                <td>
                                    <input type="text" disabled />
                                </td>
                            </tr>
                            <tr>
                                <th>대표자</th>
                                <td><input type="text" disabled /></td>
                            </tr>
                            <tr>
                                <th>법인등록번호</th>
                                <td><input type="text" disabled /></td>
                            </tr>
                            <tr>
                                <th>소재지</th>
                                <td><input type="text" class="wdFull" disabled /></td>
                            </tr>
                            <tr>
                                <th>제출처</th>
                                <td>
                                    <div class="flexArea">
                                        <select style="width: 200px">
                                            <option>제출처 선택</option>
                                            <option>주택도시보증공사 사장</option>
                                            <option>한국토지주택공사</option>
                                            <option>재건출조합</option>
                                            <option>재개발조합</option>
                                            <option>금융기관</option>
                                            <option>한국주택금융공사 사장</option>
                                            <option>건설공제조합 이사장</option>
                                            <option>기타</option>
                                        </select>

                                        <select style="width: 200px">
                                            <option>선택</option>
                                        </select>
                                        귀하
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <th>발급용도</th>
                                <td>
                                    <div class="flexArea">
                                        <select style="width: 200px">
                                            <option>발급용도 선택</option>
                                            <option></option>
                                            <option>분양보증</option>
                                            <option>신용평가</option>
                                            <option>입찰참여</option>
                                            <option>입찰참여(시공사 선정)</option>
                                            <option>택지분양신청</option>
                                            <option>기타</option>
                                        </select>

                                        <input type="text" class="full" />
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <th>발급부수</th>
                                <td>
                                    <select style="width: 120px">
                                        <option>1</option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <th>기준일자</th>
                                <td>
                                    <div class="labelArea">
                                        <label><input type="radio" name="year" />최근1년간</label>
                                        <label><input type="radio" name="year" />최근3년간</label>
                                        <label><input type="radio" name="year" />최근5년간</label>
                                        <label><input type="radio" name="year" />기타</label>
                                        <span>( <input type="date" /> ~ <input type="date" /> )</span>
                                    </div>
                                    <div class="mgt10 grayColor">
                                        <ul class="dotType smFont">
                                            <li>최근 기준일자는 직전년도 12월 31일까지의 영업실적입니다.</li>
                                            <li>당해년도 영업실적은 “기타”로 설정 후 달력에서 날짜를 선택해주세요.</li>
                                        </ul>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <th>산정기준</th>
                                <td>
                                    <div class="labelArea">
                                        <label><input type="radio" name="day" />사업계획승인일</label>
                                        <label><input type="radio" name="day" />준공(사용검사)일</label>
                                        <label><input type="radio" name="day" />단순도급실적(사업승인일)</label>
                                        <label><input type="radio" name="day" />기타</label>
                                    </div>
                                    <div class="mgt10 grayColor">
                                        <ul class="dotType smFont">
                                            <li>준공일 기준으로 실적발급시에는 사용검사필증 제출한 경우에 한합니다.</li>
                                        </ul>
                                    </div>
                                </td>
                            </tr>
                        </table>

                        <div class="btnArea">
                            <a href="#" class="btn-ok">작성완료</a>
                        </div>
                    </div>
                </div>
                <!-- //Content -->
            </section>
            <!-- //Content -->
        </main>

        <section class="footer">
            <div data-include-path="../assets/inc/footer.html"></div>
        </section>
    </body>

    <script src="../assets/js/ol-include.js"></script>
</html>
