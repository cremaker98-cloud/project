<!DOCTYPE html>
<html lang="ko">
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="../assets/css/ol-reset.css" />
        <link rel="stylesheet" href="../assets/css/ol-style.css" />
        <title>한국주택협회 인터넷증명발급</title>
    </head>

    <body>
        <div class="wrapper">
            <!-- Top & Header -->
            <section class="top">
                <div data-include-path="../assets/inc/header.html"></div>
            </section>
            <!-- //Top & Header -->

            <main>
                <!-- LNB -->
                <section class="lnb">
                    <div data-include-path="../assets/inc/lnb-customer.html"></div>
                    <div data-include-path="../assets/inc/lnb-link.html"></div>
                </section>
                <!-- //LNB -->

                <!-- Container -->
                <section class="container">
                    <div class="page-title">
                        <h3>공지사항</h3>
                        <div>
                            <a href="#" class="btn-title"><img src="../assets/img/icon-title-link-3.png" /></a>
                        </div>
                    </div>

                    <!-- Content -->
                    <div class="content">
                        <div class="searchBox">
                            <select>
                                <option>전체</option>
                                <option>제목</option>
                                <option>작성자</option>
                                <option>내용</option>
                            </select>
                            <input type="text" placeholder="검색어를 입력해주세요." />

                            <a href="#" class="btn-reset"><img src="../assets/img/btn-reset.svg" alt="reset" /></a>

                        <!-- table -->
                        <div class="tableArea">
                            <div class="tb-top">
                                <div class="count">검색결과 <strong>6</strong>건</div>
                                <div class="count-list">
                                    <label>목록 표시 개수 :</label>
                                    <select>
                                        <option>10개</option>
                                    </select>
                                </div>
                            </div>

                            <div class="tb-body">
                                <table class="d-tb-list">
                                    <colgroup>
                                        <col style="width: 5%" />
                                        <col style="width: auto" />
                                        <col style="width: 8%" />
                                        <col style="width: 15%" />
                                        <col style="width: 8%" />
                                        <col style="width: 5%" />
                                    </colgroup>
                                    <tr>
                                        <th>번호</th>
                                        <th>제목</th>
                                        <th>작성자</th>
                                        <th>작성일</th>
                                        <th>조회</th>
                                        <th>파일</th>
                                    </tr>
                                    <tr>
                                        <td>10</td>
                                        <td class="title"><a href="notice-view.html">인터넷 증명발급 시스템 일부 개선</a></td>
                                        <td>운영자</td>
                                        <td>2025-10-12</td>
                                        <td>3,421</td>
                                        <td>-</td>
                                    </tr>
                                    <tr>
                                        <td>9</td>
                                        <td class="title"><a href="notice-view.html">인터넷 증명발급 시스템 일부 개선</a></td>
                                        <td>운영자</td>
                                        <td>2025-10-12</td>
                                        <td>3,421</td>
                                        <td class="file">
                                            <a href="notice-view.html"><img src="../assets/img/icon-file.png" alt="file" /></a>
                                        </td>
                                    </tr>
                                </table>
                            </div>

                            <!-- s:pasing-->
                            <div class="pasing">
                                <ul>
                                    <li>
                                        <a href="#"><img src="../assets/img/btn-pasing-left-2.svg" alt="first" /></a>
                                        <a href="#"><img src="../assets/img/btn-pasing-left-1.svg" alt="Previous" /></a>
                                    </li>
                                    <li>
                                        <a href="#" class="on">1</a>
                                        <a href="#">2</a>
                                        <a href="#">3</a>
                                        <a href="#">4</a>
                                    </li>
                                    <li>
                                        <a href="#"><img src="../assets/img/btn-pasing-right-1.svg" alt="next" /></a>
                                        <a href="#"><img src="../assets/img/btn-pasing-right-2.svg" alt="last" /></a>
                                    </li>
                                </ul>
                            </div>
                            <!-- e:pasing-->
                        </div>
                        <!-- //table -->
                    </div>
                    <!-- //Content -->
                </section>
                <!-- //Container -->
            </main>

            <section class="footer">
                <div data-include-path="../assets/inc/footer.html"></div>
            </section>

    <script src="../assets/js/ol-include.js"></script>
</html>
