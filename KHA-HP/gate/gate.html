<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>gate-한국주택협회</title>
    </head>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        html,
        body {
            height: 100%;
        }
        .gate {
            display: flex;
            height: 100%;
        }
        .gate > section {
            flex: 1;
            cursor: pointer;
            font-size: 20px;
        }
        .gate-link {
            position: absolute;
            top: calc(50% - 80px);
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 40px;
            color: #fff;
            text-decoration: none;
            letter-spacing: -2px;
            z-index: 10;
        }
        .gate-link h3 {
            font-size: 60px;
            font-weight: 800;
            line-height: 130%;
            text-shadow: 2px 2px 1px rgba(0, 0, 0, 1);
        }

        .gate-left {
            position: relative;
            background: #ccc url(img/gateleft.png) no-repeat right top;
            background-size: cover;
            height: 100%;
            flex: 1;
            text-align: right;
        }
        .gate-left .gate-link {
            right: 200px;
            align-items: end;
        }
        .gate-right {
            position: relative;
            background: #ccc url(img/gateRight.png) no-repeat right top;
            background-size: cover;
            height: 100%;
            flex: 1;
            text-align: left;
        }
        .gate-right .gate-link {
            left: 200px;
        }

        .gate-arrow {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 10px;
            width: 140px;
            height: 140px;
            text-align: center;
            font-weight: 400;
            text-shadow: none;
            background-color: rgba(30, 34, 48, 0.4);
            border-radius: 50%;
            backdrop-filter: blur(4px);
            transition: 0.3s;
        }
        .gate-arrow p {
            color: #fff;
        }
        .gate > section:hover .gate-arrow {
            background-color: rgba(30, 34, 48, 1);
        }
        .gate-label {
            position: absolute;
            top: -50px;
            color: #fff;
            border-radius: 5px;
            background-color: rgba(255, 43, 43, 0.7);
            padding: 5px 14px 7px;
        }

        .gatedim {
            position: absolute;
            right: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0);
            z-index: 1;
            transition: 0.3s;
        }
        .gate-right > .gatedim {
            left: 0;
        }
        .gate-left:hover > .gatedim {
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
        }
        .gate-right:hover > .gatedim {
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .gatebottom {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            background-color: #1e2230;
            padding: 35px;
            z-index: 20;
        }
        .gatebottom ul {
            list-style: none;
            display: flex;
            justify-content: center;
            padding: 14px 0 10px;
        }
        .gatebottom ul li {
            padding: 0 15px;
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            line-height: 16px;
        }
        .gatebottom ul li:last-child {
            border: none;
        }
        .gatebottom p {
            color: rgba(255, 255, 255, 0.4);
        }
        @media screen and (max-width: 760px) {
            .gate {
                display: flex;
                flex-direction: column;
                height: 100vh;
            }
            .gate > section {
                font-size: 16px;
                height: auto;
            }
            .gate-link h3 {
                font-size: 45px;
            }
            .gate-left,
            .gate-right {
                text-align: center;
            }
            .gate-left .gate-link,
            .gate-right .gate-link {
                top: 50%;
                left: 50%;
                transform: translate(-50%, -40%);
                width: 90%;
                align-items: center;
                gap: 20px;
            }
            .gate-label {
                top: -36px;
                font-size: 14px;
                padding: 3px 10px 5px;
            }
            .gate-arrow {
                width: 100px;
                height: 100px;
                font-size: 16px;
            }

            .gatebottom {
                position: static;
                font-size: 12px;
                padding: 20px 0;
            }
            .gatebottom ul {
                flex-wrap: wrap;
            }
            .gatebottom ul li:first-child {
                border: none;
            }
            .gatebottom ul li:first-child {
                width: 100%;
                padding: 5px 0;
            }
        }
    </style>
    <body>
        <div class="gate">
            <section class="gate-left" onclick="location.href ='#'">
                <div class="gate-link">
                    <h3>한국주택협회<br />홈페이지</h3>
                    <div class="gate-arrow">
                        <p>바로가기</p>
                        <img src="img/gate-arrow.png" />
                    </div>
                </div>
                <div class="gatedim"></div>
            </section>

            <section class="gate-right" onclick="location.href ='https://edu.housing.or.kr/portal/home/mainAction.do?start=Y#'">
                <div class="gate-link">
                    <div class="gate-label">분양대행자 교육 접수중</div>
                    <h3>
                        주택인재개발원<br />
                        홈페이지
                    </h3>
                    <div class="gate-arrow">
                        <p>바로가기</p>
                        <img src="img/gate-arrow.png" />
                    </div>
                </div>
                <div class="gatedim"></div>
            </section>

            <div class="gatebottom">
                <img src="img/logo-w.png" alt="한국주택협회" />
                <ul>
                    <li>(06050) 서울특별시 강남구 언주로 711 (논현동 71-2, 건설회관 4층)</li>
                    <li>대표전화 : 02-6900-9000</li>
                    <li>팩스 : 02-511-6974</li>
                </ul>
                <p>Copyright(c) 2005 Korea Housing Association. All Rights Reserved.</p>
            </div>
        </div>
    </body>
</html>
